name: Verify sales pipeline
on:
  pull_request:
  push:
    branches: [main, fix/reliable-etl-readonly-sql]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sales_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/sales_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify parser, SQL restrictions, UI and PostgreSQL transactions
        run: python -m pytest -q
      - name: Validate complete source without opening a database
        run: python populate_db.py --validate-only
